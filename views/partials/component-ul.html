<ul id="component-ul" class="space-y-1"{{if and .IsHTMX (or .IsAlreadyOnSitePages .IsAlreadyOnComponents)}} hx-swap-oob="outerHTML"{{end}}>
  {{range .ComponentUl.Items}}
    {{template "partials/component-li" . }}
  {{end}}
  {{ if .ComponentUl.Next }}
    {{ template "partials/component-more" . }}
  {{ end }}
</ul>
