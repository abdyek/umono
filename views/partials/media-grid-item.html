<a
  href="/admin/media/{{ .ID }}"
  class="group relative overflow-hidden rounded-3xl border border-neutral-800 bg-neutral-900/40 transition-all duration-200 hover:border-neutral-700 hover:bg-neutral-800/40"
  hx-get="/admin/media/{{ .ID }}"
  hx-target="#media-content"
  hx-push-url="/admin/media/{{ .ID }}"
  hx-swap="outerHTML"
>
  <div class="aspect-[4/3] overflow-hidden bg-neutral-950/60">
    <img src="{{ .URL }}" alt="{{ .Name }}" class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-[1.02]">
  </div>
  <div class="flex items-center gap-3 px-4 py-4">
    <div class="min-w-0 flex-1 space-y-1">
    <p class="truncate text-sm font-medium text-neutral-200">{{ if .Alias }}{{ .Alias }}{{ else }}{{ .Name }}{{ end }}</p>
    <p class="truncate text-xs text-neutral-500">{{ .Name }}</p>
    </div>
    <span class="hidden [.htmx-request_&]:inline-flex h-5 w-5 text-white shrink-0">
      {{ template "partials/spinner" . }}
    </span>
  </div>
</a>
